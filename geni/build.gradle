// Geni.com integration module. Upstream FamilyGem does not have this module:
// all Geni code lives here so that merges from upstream stay cheap.
plugins {
    id 'com.android.library'
    id 'com.google.devtools.ksp'
}

// Geni app settings: geni.properties in the project root (git-ignored).
// Keys: geniAppId, geniHost (default www.geni.com, sandbox.geni.com for the sandbox),
// geniRedirectUri (default net.cheack.treekin://authorize; it must equal the Callback URL in the Geni app settings).
// Geni cannot redirect to the <appId>://authorize URI from its docs: a numeric app ID is not a valid URI scheme.
// The app never needs the Geni app secret: the mobile OAuth flow uses only the app ID.
// The build works without the file (empty values).
def geniProperties = new Properties()
def geniPropertiesFile = rootProject.file('geni.properties')
if (geniPropertiesFile.exists()) {
    geniPropertiesFile.withInputStream { geniProperties.load(it) }
}
def geniAppId = geniProperties.getProperty('geniAppId', '').trim()
def geniHost = geniProperties.getProperty('geniHost', 'www.geni.com').trim()
def geniRedirectUri = geniProperties.getProperty('geniRedirectUri', 'net.cheack.treekin://authorize').trim()
def geniRedirectScheme = geniRedirectUri.contains('://') ? geniRedirectUri.substring(0, geniRedirectUri.indexOf('://')) : 'net.cheack.treekin.unset'

android {
    namespace = 'app.familygem.geni'
    resourcePrefix 'geni_'
    compileSdk {
        version = release(37) {
            it.minorApiLevel = 2
        }
    }
    defaultConfig {
        minSdk = 23
        buildConfigField 'String', 'GENI_APP_ID', '"' + geniAppId + '"'
        buildConfigField 'String', 'GENI_HOST', '"' + geniHost + '"'
        buildConfigField 'String', 'GENI_REDIRECT_URI', '"' + geniRedirectUri + '"'
        manifestPlaceholders = [geniRedirectScheme: geniRedirectScheme]
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'org.familysearch.gedcom:gedcom:1.15.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver3:5.5.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.3.0'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
}
